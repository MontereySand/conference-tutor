apiVersion: apps/v1
kind: Deployment
metadata:
  name: conference-tutor
  namespace: conference-tutor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conference-tutor
  template:
    metadata:
      labels:
        app: conference-tutor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: conference-tutor
          image: conference-tutor:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: ct-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /app/data/runtime
      volumes:
        - name: runtime
          emptyDir: {}
